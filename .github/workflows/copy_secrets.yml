name: Copy Secrets to money-bot (run once)
on:
  workflow_dispatch:
jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Telegram secrets to money-bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "$TG_BOT" | gh secret set TELEGRAM_BOT_TOKEN --repo saminathanms2004-stack/money-bot
          echo "$TG_CHAT" | gh secret set TELEGRAM_CHAT_ID --repo saminathanms2004-stack/money-bot
          echo "Done copying secrets"
