name: LinkedIn Job Applier Bot

on:
  schedule:
    - cron: '30 3,9,15 * * 1-5'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install groq python-dotenv requests supabase

      - name: Patch secrets into config
        run: |
          sed -i "s/username = .*/username = \"${{ secrets.LINKEDIN_USERNAME }}\"/" config/secrets.py
          sed -i "s/password = .*/password = \"${{ secrets.LINKEDIN_PASSWORD }}\"/" config/secrets.py
          sed -i "s/llm_api_key = .*/llm_api_key = \"${{ secrets.GROQ_API_KEY }}\"/" config/secrets.py
          sed -i "s|llm_api_url = .*|llm_api_url = \"https://api.groq.com/openai/v1/\"|" config/secrets.py
          sed -i "s/llm_model = .*/llm_model = \"llama3-8b-8192\"/" config/secrets.py
          sed -i "s/ai_provider = .*/ai_provider = \"openai\"/" config/secrets.py

      - name: Run job applier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          python runAiBot.py || python cloud_bot.py

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ Job bot FAILED. Check: https://github.com/saminathanms2004-stack/sam-job-bot/actions"
